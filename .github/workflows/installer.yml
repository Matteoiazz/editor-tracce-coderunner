# Crea gli installer per Windows, macOS e Linux. Ogni installer va costruito sul proprio sistema
# (il Python incluso è diverso per ciascuno), quindi si usano le macchine di GitHub.
# Si avvia creando un tag "v..." (es. v1.1.0): gli installer vengono allegati alla release
# con lo stesso nome. Dalla scheda Actions si può anche avviare a mano, per provarlo senza
# release: gli installer restano scaricabili tra gli "artifacts" dell'esecuzione.

name: Installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            files: frontend/release/*.exe
          - os: macos-latest # Apple Silicon (M1 e successivi)
            target: --mac --arm64
            files: frontend/release/*.dmg
          - os: macos-15-intel # Mac con processore Intel
            target: --mac --x64
            files: frontend/release/*.dmg
          - os: ubuntu-22.04 # versione meno recente: l'app funziona anche sulle distribuzioni più vecchie
            target: --linux
            files: |
              frontend/release/*.AppImage
              frontend/release/*.deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend (venv e test)
        working-directory: backend
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          $PY -m pip install --quiet -e ".[dev]"
          $PY -m pytest -q

      - name: Interfaccia (dipendenze e test)
        working-directory: frontend
        run: |
          npm ci
          npm test

      - name: Python incluso
        working-directory: frontend
        run: npm run prepara-python

      - name: Installer
        working-directory: frontend
        run: |
          npm run build
          npx electron-builder ${{ matrix.target }} --publish never

      - uses: actions/upload-artifact@v5
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: installer
          merge-multiple: true

      - name: Allega gli installer alla release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l installer
          # Se la release è già stata creata dal sito, gli installer vengono solo aggiunti
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" installer/* --clobber
          else
            gh release create "$TAG" installer/* --title "$TAG" --generate-notes
          fi
